# Executed by threew.silver.rules; resolved settings are saved with every run.
version: 1
domains:
  opening_min_pct: 0.0
  opening_max_pct: 100.0
  valve_states: [0.0, 0.5, 1.0]
cleaning:
  choke_forward_fill_max_seconds: 3
  missing_classes: preserve_unknown
  missing_sensors: preserve_missing
  other_invalid_sensors: null_in_clean_column
sequence:
  # Expected spacing used to flag timestamp-sequence breaks and limit choke repairs.
  expected_interval_seconds: 1
