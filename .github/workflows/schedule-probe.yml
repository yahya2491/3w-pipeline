name: Schedule probe

# TEMPORARY (step 24.3): no scheduled Bronze run has fired yet. This echo-only job on a
# GitHub-hosted runner shows whether any schedule fires in this repo. Remove it once it has.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the trigger
        run: echo "event=$EVENT schedule='$SCHEDULE' ref=$GITHUB_REF at $(date -u +%FT%TZ)"
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
