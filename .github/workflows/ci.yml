name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One group per branch (and per pull request): a new push cancels the run it made outdated
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (the version pinned in requirements-dev.lock)
        run: pip install "$(grep -E '^ruff==' requirements-dev.lock)"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # see both Java versions' results even if one fails
      matrix:
        java: [8, 17] # 8 is the VM's, 17 the laptop's
    env:
      # Tests never touch the network: anything that tries to reach Hugging Face fails instead of downloading.
      # No HF_TOKEN and no other secrets in this job.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Install the locked environment
        run: pip install -r requirements-dev.lock && pip install -e . --no-deps
      - name: Test
        run: pytest -q --junitxml=test-results/junit-java${{ matrix.java }}.xml
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-java${{ matrix.java }}
          path: test-results/
